<meta charset="utf-8">
<title>%%TITLE%%</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400..800;1,400..800&display=swap">
<style>
/* layout: one 16:9 stage, letterboxed on a graphite ground, a quiet transport bar under it. Dark by design: it is a film. */
:root {
  --bg: #0c0d0e; --stage: #0c0d0e; --surface: #16171a; --surface2: #1e2023; --line: #2a2c30;
  --ink: #ecebe5; --mute: #8b8d91; --gold: #e2c13e; --steel: #8f9aa8;
  --f-disp: "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace; --f-mono: "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-disp); overflow: hidden; }
#app { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#stage { position: relative; background: var(--stage); border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.05); touch-action: pan-y; cursor: pointer; flex: none; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#bar { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 100%; flex: none; min-width: 0; }
.btn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.btn:hover { background: var(--surface2); }
.btn:focus-visible, .seg:focus-visible, .pill:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.pill { flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 12px/1 var(--f-mono); cursor: pointer; letter-spacing: .02em; }
.pill:hover { background: var(--surface2); }
#segs { flex: 1 1 auto; display: flex; gap: 3px; height: 36px; align-items: center; min-width: 60px; }
.seg { flex: 1 1 0; height: 6px; border-radius: 3px; background: rgba(255,255,255,.09); border: 0; padding: 0; cursor: pointer; position: relative; overflow: hidden; }
.seg i { position: absolute; inset: 0; width: 0; background: rgba(236,235,229,.85); }
.seg.on { background: rgba(226,174,79,.28); }
.seg.on i { background: var(--gold); }
#count { flex: none; font: 500 12px/1 var(--f-mono); color: var(--mute); font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; }
#chap { flex: 0 1 auto; min-width: 0; max-width: 280px; font: 600 12px/1.2 var(--f-mono); color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#src { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 32px)); max-height: min(70vh, 640px); overflow: auto;
  background: #141517; border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; z-index: 5; box-shadow: 0 30px 80px -30px #000; }
#src h2 { margin: 0 0 4px; font: 700 15px/1.3 var(--f-disp); }
#src p.sub { margin: 0 0 12px; color: var(--mute); font: 500 12px/1.4 var(--f-mono); }
#src ol { margin: 0; padding-left: 20px; display: grid; gap: 9px; }
#src li { font: 400 13px/1.45 var(--f-disp); color: #d8d7d1; }
#src a { color: var(--gold); text-underline-offset: 3px; word-break: break-word; }
#src .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
body.clean #bar, body.clean #src { display: none; }
body.clean #stage { border-radius: 0; box-shadow: none; }
body.cap #app { padding: 0; }
@media (max-width: 720px) { #chap, .opt { display: none; } }
@media (prefers-reduced-motion: reduce) { .btn, .pill { transition: none; } }
</style>
<div id="app">
  <div id="stage" role="img" aria-label="%%TITLE%%: animated presentation">
    <canvas id="fx"></canvas>
  </div>
  <nav id="bar" aria-label="Presentation controls">
    <button class="btn" id="prev" type="button" aria-label="Previous slide"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
    <button class="btn" id="play" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path id="playIcon" d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg></button>
    <button class="btn" id="next" type="button" aria-label="Next slide"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
    <span id="chap"></span>
    <div id="segs"></div>
    <span id="count"></span>
    <button class="pill" id="sndBtn" type="button" aria-pressed="false" title="Mechanical sound design (S)">sound off</button>
    <button class="pill opt" id="srcBtn" type="button" aria-expanded="false" aria-controls="src">sources</button>
    <button class="pill opt" id="cleanBtn" type="button" title="Hide controls (H)">clean</button>
    <button class="btn" id="fs" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  </nav>
  <aside id="src" hidden aria-label="Sources"></aside>
</div>
