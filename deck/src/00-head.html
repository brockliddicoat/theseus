/* layout: one 16:9 stage, letterboxed on a graphite ground, a quiet transport bar under it. Dark by design: it is a film. */
:root {
  --bg: #0D0E0F; --stage: #0D0E0F; --surface: #16171a; --surface2: #1e2023; --line: #2a2c30;
  --ink: #F3F2EE; --mute: #96958F; --hero: #2F8CFF; --steel: #8f9aa8;
  --f-disp: "Inter", system-ui, sans-serif; --f-mono: "JetBrains Mono", "Inter", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-disp); overflow: hidden; }
#app { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#stage { position: relative; background: var(--stage); border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.05); touch-action: pan-y; cursor: pointer; flex: none; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; max-width: 100%; flex: none; min-width: 0; }
.btn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.btn:hover { background: var(--surface2); }
.btn:focus-visible, .seg:focus-visible, .pill:focus-visible { outline: 2px solid var(--hero); outline-offset: 2px; }
.pill { flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 12px/1 var(--f-mono); cursor: pointer; letter-spacing: .08em; text-transform: uppercase; }
.pill:hover { background: var(--surface2); }
#segs { flex: 1 1 120px; display: flex; gap: 3px; height: 36px; align-items: center; min-width: 90px; }
.seg { flex: 1 1 0; height: 6px; border-radius: 3px; background: rgba(255,255,255,.09); border: 0; padding: 0; cursor: pointer; position: relative; overflow: hidden; }
.seg i { position: absolute; inset: 0; width: 0; background: rgba(236,235,229,.85); }
.seg.on { background: rgba(47,140,255,.30); }
.seg.on i { background: var(--hero); }
#count { flex: none; font: 500 12px/1 var(--f-mono); color: var(--mute); font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; }
#chap { flex: 0 1 auto; min-width: 0; max-width: 280px; font: 600 12px/1.2 var(--f-mono); color: var(--mute); text-transform: uppercase; letter-spacing: .1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#src { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--barH, 44px) + 20px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 32px)); max-height: min(70vh, 640px); overflow: auto;
  background: #141517; border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; z-index: 5; box-shadow: 0 30px 80px -30px #000; }
#src h2 { margin: 0 0 4px; font: 700 15px/1.3 var(--f-disp); }
#src p.sub { margin: 0 0 12px; color: var(--mute); font: 500 12px/1.4 var(--f-mono); }
#src ol { margin: 0; padding-left: 20px; display: grid; gap: 9px; }
#src li { font: 400 14px/1.5 var(--f-disp); color: #d8d7d1; }
#src a { color: var(--hero); text-underline-offset: 3px; word-break: break-word; }
#src .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
#viewBtn { display: flex; align-items: center; gap: 5px; }
#viewBtn[hidden] { display: none; }
#viewBtn span { opacity: .42; }
#viewBtn .vs { opacity: .25; }
#viewBtn[aria-pressed="true"] .v2, #viewBtn[aria-pressed="false"] .v3 { opacity: 1; color: var(--hero); }
#rate, #edit { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(var(--barH, 44px) + 20px + env(safe-area-inset-bottom, 0px)); width: min(600px, calc(100% - 32px)); box-sizing: border-box;
  background: rgba(20,21,23,.96); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; z-index: 6; box-shadow: 0 24px 60px -24px #000; }
#rate .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
#rate h2 { margin: 0; font: 700 14px/1.3 var(--f-disp); }
#rate .hint { margin-left: 6px; color: var(--mute); font: 500 11px/1 var(--f-mono); }
#rate .state { color: var(--mute); font: 500 11px/1.3 var(--f-mono); white-space: nowrap; }
#rate .slide { margin: 4px 0 8px; font: 600 12px/1.35 var(--f-disp); color: #bdbcb6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#rate .was[hidden] { display: none; }
#rate .wnote { margin: 0 0 4px; font: 500 12px/1.4 var(--f-disp); color: var(--ink); }
#rate .wans { margin: 0 0 6px; padding-left: 18px; font: 400 12px/1.4 var(--f-disp); color: #bdbcb6; }
#rate .wans q { color: var(--ink); }
#rate .wrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
#rate .wq { color: var(--mute); font: 500 11px/1.3 var(--f-mono); }

#rate .vals { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; }
#rate .vals button { height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 700 14px/1 var(--f-disp); cursor: pointer; font-variant-numeric: tabular-nums; padding: 0; }
#rate .vals button:hover { background: var(--surface2); }
#rate .vals button.on { background: var(--hero); border-color: var(--hero); color: #fff; }
#rate .vals button:disabled { opacity: .45; cursor: default; }
#rate .row { display: flex; align-items: stretch; gap: 8px; margin-top: 8px; }
#rate textarea { box-sizing: border-box; flex: 1 1 auto; min-width: 0; height: 32px; min-height: 32px; resize: vertical; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: 400 13px/1.3 var(--f-disp); }
#rate .row .pill { height: 32px; padding: 0 12px; }
#rateBtn[aria-expanded="true"] { border-color: var(--hero); }
/* edit mode: tap any text on the slide to change it (Brock, 2026-11-05) */
#edit h2 { margin: 0; font: 700 14px/1.3 var(--f-disp); }
#edit .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

#edit .hint { margin: 6px 0 0; color: #bdbcb6; font: 500 13px/1.4 var(--f-disp); }

#edit textarea { box-sizing: border-box; width: 100%; min-height: 64px; resize: vertical; background: var(--surface); color: var(--ink); border: 1px solid var(--hero); border-radius: 6px; padding: 8px 10px; font: 500 16px/1.35 var(--f-disp); }
#edit .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
#edit .row .pill { height: 34px; padding: 0 12px; }
#editBtn[aria-pressed="true"] { border-color: var(--hero); background: var(--hero); color: #fff; }
body.editing #stage { cursor: text; }
body.clean #rate, body.clean #edit { display: none; }
body.clean #bar, body.clean #src { display: none; }
body.clean #stage { border-radius: 0; box-shadow: none; }
body.cap #app { padding: 0; }
@media (max-width: 720px) { #chap, #cleanBtn { display: none; }
  #rate, #edit, #src { top: calc(env(safe-area-inset-top, 0px) + 8px); bottom: auto; left: 8px; right: 8px; width: auto; max-height: 46vh; overflow: auto; }
  #rate .vals button { height: 40px; } .pill { height: 38px; } }
@media (prefers-reduced-motion: reduce) { .btn, .pill { transition: none; } }
