<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THESEUS — Recommendations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400..800;1,400..800&display=swap">
<style>
/* layout: one 16:9 stage, letterboxed on a graphite ground, a quiet transport bar under it. Dark by design: it is a film. */
:root {
  --bg: #0c0d0e; --stage: #0c0d0e; --surface: #16171a; --surface2: #1e2023; --line: #2a2c30;
  --ink: #ecebe5; --mute: #8b8d91; --gold: #e2c13e; --steel: #8f9aa8;
  --f-disp: "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace; --f-mono: "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-disp); overflow: hidden; }
#app { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#stage { position: relative; background: var(--stage); border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.05); touch-action: pan-y; cursor: pointer; flex: none; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#bar { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 100%; flex: none; min-width: 0; }
.btn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.btn:hover { background: var(--surface2); }
.btn:focus-visible, .seg:focus-visible, .pill:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.pill { flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 12px/1 var(--f-mono); cursor: pointer; letter-spacing: .02em; }
.pill:hover { background: var(--surface2); }
#segs { flex: 1 1 auto; display: flex; gap: 3px; height: 36px; align-items: center; min-width: 60px; }
.seg { flex: 1 1 0; height: 6px; border-radius: 3px; background: rgba(255,255,255,.09); border: 0; padding: 0; cursor: pointer; position: relative; overflow: hidden; }
.seg i { position: absolute; inset: 0; width: 0; background: rgba(236,235,229,.85); }
.seg.on { background: rgba(226,174,79,.28); }
.seg.on i { background: var(--gold); }
#count { flex: none; font: 500 12px/1 var(--f-mono); color: var(--mute); font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; }
#chap { flex: 0 1 auto; min-width: 0; max-width: 280px; font: 600 12px/1.2 var(--f-mono); color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#src { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 32px)); max-height: min(70vh, 640px); overflow: auto;
  background: #141517; border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; z-index: 5; box-shadow: 0 30px 80px -30px #000; }
#src h2 { margin: 0 0 4px; font: 700 15px/1.3 var(--f-disp); }
#src p.sub { margin: 0 0 12px; color: var(--mute); font: 500 12px/1.4 var(--f-mono); }
#src ol { margin: 0; padding-left: 20px; display: grid; gap: 9px; }
#src li { font: 400 13px/1.45 var(--f-disp); color: #d8d7d1; }
#src a { color: var(--gold); text-underline-offset: 3px; word-break: break-word; }
#src .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
body.clean #bar, body.clean #src { display: none; }
body.clean #stage { border-radius: 0; box-shadow: none; }
body.cap #app { padding: 0; }
@media (max-width: 720px) { #chap, .opt { display: none; } }
@media (prefers-reduced-motion: reduce) { .btn, .pill { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage" role="img" aria-label="THESEUS — Recommendations: animated presentation">
    <canvas id="fx"></canvas>
  </div>
  <nav id="bar" aria-label="Presentation controls">
    <button class="btn" id="prev" type="button" aria-label="Previous slide"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
    <button class="btn" id="play" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path id="playIcon" d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg></button>
    <button class="btn" id="next" type="button" aria-label="Next slide"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
    <span id="chap"></span>
    <div id="segs"></div>
    <span id="count"></span>
    <button class="pill" id="sndBtn" type="button" aria-pressed="false" title="Mechanical sound design (S)">sound off</button>
    <button class="pill opt" id="srcBtn" type="button" aria-expanded="false" aria-controls="src">sources</button>
    <button class="pill opt" id="cleanBtn" type="button" title="Hide controls (H)">clean</button>
    <button class="btn" id="fs" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  </nav>
  <aside id="src" hidden aria-label="Sources"></aside>
</div>

<script>
/* ============================================================================================
   core: stage size, palette, type, easing, time helpers, 2D drawing primitives.
   Every frame is a pure function of slide time t (seconds), so any frame can be captured.
   ============================================================================================ */
'use strict';
const W = 1920, H = 1080;

/* the old film's system: the stage is night (TH = 0) or paper (TH = 1); every slide picks one, and the
   transitions between them are where white turns to black. Accents as in the film. One typeface. */
let TH = 0;
const PAPER = '#f7f6f2', NIGHT = '#0d0e0f';
const C = {
  red: '#e5484d', redL: '#ef7275', redD: '#b8383d',
  blue: '#4a86e8', blueL: '#77a5f0', blueD: '#3466bf',
  purple: '#9a6ee0', purpleL: '#b693ec', purpleD: '#7650bd',
  green: '#46b35a', greenL: '#71c982', greenD: '#338a45',
  brown: '#9a6a3d', brownL: '#c08a52', gray: '#9da3ae', white: '#ffffff'
};
Object.defineProperties(C, {
  bg: { get: () => (TH ? PAPER : NIGHT) },
  ink: { get: () => (TH ? '#141516' : '#ecebe7') },
  ink2: { get: () => (TH ? '#2f3032' : '#c9c8c2') },
  mute: { get: () => (TH ? '#5c5b55' : '#9b9a94') },
  faint: { get: () => (TH ? '#8e8c85' : '#68675f') },
  hair: { get: () => (TH ? '#d6d4cd' : '#2c2d31') },
  panel: { get: () => (TH ? '#ffffff' : 'rgba(24,25,27,0.92)') },
  yellow: { get: () => (TH ? '#b6961c' : '#e2c13e') },
  orange: { get: () => (TH ? '#d4861c' : '#f0a43a') },
  gold: { get: () => (TH ? '#b6961c' : '#e2c13e') },
  loss: { get: () => C.red },
  steel: { get: () => C.gray },
  cool: { get: () => C.blue }
});
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
function rgba(hex, a) { if (hex.startsWith('rgba')) return hex; const c = hexRgb(hex); return `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${a})`; }
function inkA(a) { return TH ? `rgba(20,21,22,${a})` : `rgba(236,235,231,${a})`; }
/** the accent of a chapter */
const ACC = { intro: () => C.ink, click: () => C.blue, glide: () => C.green, shell: () => C.yellow, surface: () => C.purple, elec: () => C.orange, shape: () => C.brownL, own: () => TH ? '#676c75' : C.gray, end: () => C.ink };
function acc(key) { const f = ACC[key || (typeof curSlide === 'function' && curSlide() ? curSlide().ch : 'intro')]; return f ? f() : C.ink; }

const FONT = {
  disp: '"JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace',
  mono: '"JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace'
};

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const smooth = x => x * x * (3 - 2 * x);
const E = {
  lin: x => x,
  out2: x => 1 - (1 - x) * (1 - x),
  out3: x => 1 - Math.pow(1 - x, 3),
  out5: x => 1 - Math.pow(1 - x, 5),
  in3: x => x * x * x,
  io3: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  io5: x => x < .5 ? 16 * Math.pow(x, 5) : 1 - Math.pow(-2 * x + 2, 5) / 2,
  cam: bezier(0.7, 0, 0.2, 1),      /* strong asymmetric in-out: camera moves */
  snap: bezier(0.2, 0, 0, 1),       /* fast attack, long settle: things arriving */
  hit: bezier(0.55, 0, 1, 0.45)     /* accelerates into contact: a plunger meeting a switch */
};
/** cubic bezier easing (x1, y1, x2, y2), solved by Newton iterations */
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const fx = s => ((ax * s + bx) * s + cx) * s, fy = s => ((ay * s + by) * s + cy) * s, dx = s => (3 * ax * s + 2 * bx) * s + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let s = x;
    for (let i = 0; i < 8; i++) { const d = dx(s); if (Math.abs(d) < 1e-6) break; s -= (fx(s) - x) / d; }
    return fy(clamp(s));
  };
}
/** eased progress of t through [a, b] */
const ep = (t, a, b, e = E.io3) => e(prog(t, a, b));
/** rises over [a, b] and falls over [c, d] */
const env = (t, a, b, c, d, e = E.io3) => Math.min(ep(t, a, b, e), 1 - ep(t, c, d, e));
/** keyframes [[t, v], ...] with easing between neighbours */
function kf(t, keys, e = E.io3) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) { const [t0, v0] = keys[i - 1], [t1, v1] = keys[i]; const k = (keys[i][2] || e)(prog(t, t0, t1)); return Array.isArray(v0) ? v0.map((v, j) => lerp(v, v1[j], k)) : lerp(v0, v1, k); }
  }
  return keys[keys.length - 1][1];
}
/** periodic event: phase 0..1 inside a cycle of `per` seconds starting at t0 (negative before t0) */
const cyc = (t, t0, per) => t < t0 ? -1 : ((t - t0) % per) / per;
/** seeded random */
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const fmt = (v, d = 0) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });

/* ---------- 2D drawing (stage units 1920 x 1080) ---------- */
let G = null; /* the overlay context, set by the app each frame */
function setFont(o) {
  const fam = FONT[o.font || 'disp'] || o.font;
  G.font = `${o.italic ? 'italic ' : ''}${o.weight || 400} ${o.size || 28}px ${fam}`;
  try { G.fontStretch = o.stretch || 'normal'; } catch (e) { /* older canvas */ }
  try { G.letterSpacing = (o.ls || 0) + 'px'; } catch (e) { }
}
/** width of a string in the given style */
function tw(s, o) { setFont(o); return G.measureText(s).width; }
/** split text into lines that fit maxW */
function wrap(s, o, maxW) {
  const out = []; for (const para of String(s).split('\n')) {
    const words = para.split(' '); let line = '';
    for (const w of words) { const test = line ? line + ' ' + w : w; if (line && tw(test, o) > maxW) { out.push(line); line = w; } else line = test; }
    out.push(line);
  }
  return out;
}
/** typing: how many characters of s are visible at time t when typing starts at t0 */
function typed(s, t, t0, cps = 55) {
  if (t0 == null) return s.length;
  return clamp(Math.floor((t - t0) * cps), 0, s.length);
}
/**
 * text: o = {size, weight, font, stretch, color, alpha, align, base, ls, maxW, lh, t, t0 (typing start), cps, caret,
 *            wipe (0..1 left-to-right reveal)}; returns {w, h, lines}
 */
function text(s, x, y, o = {}) {
  setFont(o);
  G.textAlign = o.align || 'left'; G.textBaseline = o.base || 'alphabetic';
  const lines = o.maxW ? wrap(s, o, o.maxW) : String(s).split('\n');
  const lh = (o.lh || 1.22) * (o.size || 28);
  const total = lines.reduce((n, l) => n + l.length, 0);
  let shown = o.t0 != null ? typed(s, o.t, o.t0, o.cps || 55) : Infinity;
  const a = o.alpha == null ? 1 : o.alpha;
  if (a <= 0.001) return { w: 0, h: lines.length * lh, lines };
  G.globalAlpha = a; G.fillStyle = o.color || C.ink;
  let maxw = 0, k = 0;
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i], n = clamp(shown - k, 0, L.length); k += L.length + 1;
    const vis = L.slice(0, n), ly = y + i * lh;
    const fullW = G.measureText(L).width; maxw = Math.max(maxw, fullW);
    if (o.wipe != null && o.wipe < 1) {
      if (o.wipe <= 0) continue;
      const x0 = o.align === 'center' ? x - fullW / 2 : o.align === 'right' ? x - fullW : x;
      G.save(); G.beginPath(); G.rect(x0 - 4, ly - o.size * 1.2, (fullW + 8) * o.wipe, o.size * 1.7); G.clip();
      G.fillText(vis, x, ly); G.restore();
    } else G.fillText(vis, x, ly);
    if (o.caret && o.t0 != null && n < L.length && n > 0 && shown < total) {
      const cw = G.measureText(vis).width, cx = o.align === 'center' ? x - fullW / 2 + cw : x + cw;
      G.fillRect(cx + 3, ly - o.size * 0.78, Math.max(2, o.size * 0.08), o.size * 0.9);
    }
  }
  G.globalAlpha = 1;
  return { w: maxw, h: lines.length * lh, lines };
}
function line(x1, y1, x2, y2, o = {}) {
  const p = o.p == null ? 1 : o.p; if (p <= 0) return;
  G.globalAlpha = o.alpha == null ? 1 : o.alpha; G.strokeStyle = o.color || C.ink; G.lineWidth = o.w || 2;
  G.lineCap = o.cap || 'butt'; G.setLineDash(o.dash || []);
  G.beginPath(); G.moveTo(x1, y1); G.lineTo(lerp(x1, x2, p), lerp(y1, y2, p)); G.stroke();
  G.setLineDash([]); G.globalAlpha = 1;
}
function poly(pts, o = {}) {
  if (pts.length < 2) return;
  const p = o.p == null ? 1 : o.p; if (p <= 0) return;
  G.globalAlpha = o.alpha == null ? 1 : o.alpha;
  G.beginPath();
  let total = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
  let left = total * p; G.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    if (left >= seg[i - 1]) { G.lineTo(pts[i][0], pts[i][1]); left -= seg[i - 1]; }
    else { const k = left / seg[i - 1]; G.lineTo(lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)); break; }
  }
  if (o.close && p >= 1) G.closePath();
  if (o.fill) { G.fillStyle = o.fill; G.fill(); }
  if (o.color !== null) { G.strokeStyle = o.color || C.ink; G.lineWidth = o.w || 2; G.lineJoin = 'round'; G.lineCap = o.cap || 'round'; G.setLineDash(o.dash || []); G.stroke(); G.setLineDash([]); }
  G.globalAlpha = 1;
}
function rect(x, y, w, h, o = {}) {
  G.globalAlpha = o.alpha == null ? 1 : o.alpha;
  if (o.fill) { G.fillStyle = o.fill; G.fillRect(x, y, w, h); }
  if (o.color) { G.strokeStyle = o.color; G.lineWidth = o.w || 1.5; G.strokeRect(x, y, w, h); }
  G.globalAlpha = 1;
}
function circle(x, y, r, o = {}) {
  G.globalAlpha = o.alpha == null ? 1 : o.alpha;
  G.beginPath(); G.arc(x, y, Math.max(0, r), o.a0 || 0, o.a1 == null ? Math.PI * 2 : o.a1);
  if (o.fill) { G.fillStyle = o.fill; G.fill(); }
  if (o.color) { G.strokeStyle = o.color; G.lineWidth = o.w || 2; G.setLineDash(o.dash || []); G.stroke(); G.setLineDash([]); }
  G.globalAlpha = 1;
}
/** an arrow from (x1,y1) to (x2,y2), drawn to progress p, head size hs */
function arrow(x1, y1, x2, y2, o = {}) {
  const p = o.p == null ? 1 : o.p; if (p <= 0.001) return;
  const x = lerp(x1, x2, p), y = lerp(y1, y2, p), a = Math.atan2(y - y1, x - x1), hs = o.hs || 16, w = o.w || 3;
  const len = Math.hypot(x - x1, y - y1);
  const back = Math.min(hs, len);
  line(x1, y1, x - Math.cos(a) * back * 0.6, y - Math.sin(a) * back * 0.6, { color: o.color, w, alpha: o.alpha });
  G.globalAlpha = o.alpha == null ? 1 : o.alpha; G.fillStyle = o.color || C.ink;
  G.beginPath(); G.moveTo(x, y);
  G.lineTo(x - Math.cos(a - 0.42) * back, y - Math.sin(a - 0.42) * back);
  G.lineTo(x - Math.cos(a + 0.42) * back, y - Math.sin(a + 0.42) * back); G.closePath(); G.fill(); G.globalAlpha = 1;
}
/** clip all drawing in fn to a rectangle */
function clipped(x, y, w, h, fn) { G.save(); G.beginPath(); G.rect(x, y, w, h); G.clip(); fn(); G.restore(); }

/* ---------- the film's paper: a still 40 px grid, a + on every fourth crossing ---------- */
function paper(a = 1) {
  if (a <= 0.003) return;
  G.save(); G.globalAlpha = a; G.lineWidth = 1;
  G.strokeStyle = inkA(TH ? 0.055 : 0.035); G.beginPath();
  for (let x = 0; x <= W + 40; x += 40) { G.moveTo(x + 0.5, 0); G.lineTo(x + 0.5, H); }
  for (let y = 0; y <= H + 40; y += 40) { G.moveTo(0, y + 0.5); G.lineTo(W, y + 0.5); }
  G.stroke();
  G.strokeStyle = inkA(TH ? 0.34 : 0.24); G.lineWidth = 1.5; G.beginPath();
  for (let x = 0; x <= W + 160; x += 160) for (let y = 0; y <= H + 160; y += 160) { G.moveTo(x - 7, y); G.lineTo(x + 7, y); G.moveTo(x, y - 7); G.lineTo(x, y + 7); }
  G.stroke(); G.restore();
}
/** rounded rectangle path */
function rrPath(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); G.beginPath(); G.moveTo(x + r, y); G.arcTo(x + w, y, x + w, y + h, r); G.arcTo(x + w, y + h, x, y + h, r); G.arcTo(x, y + h, x, y, r); G.arcTo(x, y, x + w, y, r); G.closePath(); }
function rr(x, y, w, h, r, fill, stroke, lw = 1.5, a = 1) { G.save(); G.globalAlpha = a; rrPath(x, y, w, h, r); if (fill) { G.fillStyle = fill; G.fill(); } if (stroke) { G.strokeStyle = stroke; G.lineWidth = lw; G.stroke(); } G.restore(); }
/** a demonstration's own window on the paper (nothing sits straight on the grid) */
function demoWindow(x, y, w, h, a = 1, o = {}) {
  if (a <= 0.003) return;
  const r = o.r || 14;
  /* paper windows sit on a very soft shadow, so the page reads in layers */
  if (TH && !o.plain) { G.save(); G.globalAlpha = a; G.shadowColor = 'rgba(30,32,40,0.075)'; G.shadowBlur = 26; G.shadowOffsetY = 9; rrPath(x, y, w, h, r); G.fillStyle = o.fill || C.panel; G.fill(); G.restore(); }
  rr(x, y, w, h, r, o.fill || C.panel, inkA(0.12), 1.5, a);
  if (a >= 0.999 || o.plain) return;
  /* on the way in: a soft reflection passes once across the window, and its border traces itself in */
  const p = E.io3(a), bx = x - w * 0.3 + w * 1.6 * p, g = G.createLinearGradient(bx - 140, y, bx + 140, y + Math.min(h, 400) * 0.35);
  const hi = TH ? 'rgba(120,138,168,0.10)' : 'rgba(255,255,255,0.075)';
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, hi); g.addColorStop(1, 'rgba(255,255,255,0)');
  G.save(); rrPath(x, y, w, h, r); G.clip(); G.globalAlpha = Math.sin(p * Math.PI); G.fillStyle = g; G.fillRect(x, y, w, h); G.restore();
  const per = 2 * (w + h), L = per * p, col = typeof acc === 'function' ? acc() : C.ink;
  G.save(); G.globalAlpha = 0.75 * (1 - p); G.strokeStyle = col; G.lineWidth = 2; G.setLineDash([L, per]); rrPath(x, y, w, h, r); G.stroke(); G.restore();
}

/* ============================================================================================
   parts: close-up technical drawings of single components, in millimetres (y down). Nothing in here
   draws the mouse or its shape: the shape is the part most likely to change, so it never appears.
   Where a drawing has to include part of the shell or a trigger, the curvature is soft and
   deliberately generic, and the piece ends in a break line.
   Each part has a painter in mm (…MM) and a stage wrapper (part()) that places it at (x, y) with
   s pixels per millimetre. Painters report named points in stage pixels for callouts.
   Drawing conventions: cut material is hatched, fasteners and shafts are not, anything that
   continues past the drawing ends in a break line.
   ============================================================================================ */
const TAU = Math.PI * 2;

/* ---------- materials ---------- */
const MT = {

  pom: { g: ['#f8f6f0', '#dedcd7'] }, ptfe: { g: ['#ffffff', '#ece9e1'] }, glass: { g: ['#eef6f9', '#c4d6de'] },
  steel: { g: ['#eef1f4', '#9aa2ab', '#d4d9df'] }, spring: { g: ['#dde1e6', '#8d959e'] }, brass: { g: ['#f4dc96', '#b48b2c', '#e9c870'] },
  copper: { g: ['#f3bb88', '#b56c33'] }, silver: { g: ['#ffffff', '#b1b7bf'] },
  tin: { g: ['#f4f5f7', '#a2a8b0', '#e3e6ea'] }, fr4: { g: ['#55613c', '#424d2d'], dark: 1 }, mask: { g: ['#222327', '#141518'], dark: 1 },
  lens: { g: ['rgba(205,235,250,0.55)', 'rgba(150,200,228,0.36)'] }, rubber: { g: ['#303135', '#232427'], dark: 1 },
  foam: { g: ['#3b3c42', '#2d2e33'], dark: 1 }, cloth: { g: ['#5b5e65', '#43464c'], dark: 1 }, white: { g: ['#fdfcf9', '#dbdad5'] },

/** fill a path with a material, optionally hatch it (cut material), then outline it */
function solid(path, mt, box, o = {}) {

/** a break line: the S-curve that says the part continues */

function mmLine(pts, col, px, o = {}) { G.beginPath(); pts.forEach((p, i) => i ? G.lineTo(p[0], p[1]) : G.moveTo(p[0], p[1])); if (o.close) G.closePath(); G.strokeStyle = col; G.lineWidth = lw(px); G.setLineDash(o.dash ? o.dash.map(v => v * mmpx()) : []); G.lineCap = o.cap || 'round'; G.lineJoin = 'round'; G.stroke(); G.setLineDash([]); }

/* ---------- a circuit board in section: mask, copper, glass-fibre core, plated holes full of solder ---------- */

/* =================================== 1. snap-action switch ===================================
   side elevation, origin at the bottom-left of the body (12.8 x 6.5 mm). o.clear shows the cover clear,
   so the leaf spring, its tongue and the three contacts are visible. press 0..1 of 0.8 mm travel; the
   moving contact snaps from NC (top) to NO (bottom) at 0.5 mm unless o.state forces it. */

    solid(() => { G.beginPath(); G.moveTo(9.25, -4.9); G.lineTo(12.08, -4.9); G.lineTo(12.08, Q.base); G.lineTo(11.76, Q.base); G.lineTo(11.76, -4.6); G.lineTo(9.25, -4.6); G.closePath(); }, MT.copper, [9.25, -4.9, 2.83, 3.2], { lw: 0.8 });

    G.beginPath(); G.moveTo(0.45, Q.base); G.lineTo(0.45, -5.7); G.quadraticCurveTo(0.45, -6.05, 0.8, -6.05); G.lineTo(4.62, -6.05); G.moveTo(6.58, -6.05); G.lineTo(12.0, -6.05); G.quadraticCurveTo(12.35, -6.05, 12.35, -5.7); G.lineTo(12.35, Q.base);
    G.strokeStyle = inkA(0.22); G.lineWidth = lw(1); G.stroke();

/* =================================== 2. the click mechanism, in section ===================================

   (a spring-steel plate clamped under the boss and staked to the trigger; it is the hinge), the trigger with
   its plunger post, and the switch on its board. the surface is a soft, generic crown, not the shape. origin near the rear cutout, front to the right. */
const CKG = { rc: [-1.4, 1.0], foot: [30, 7.6], post: [29, 31], tPost: [4, 8], boss: [-13.2, -6.8], plateY: 0.8, gap: [-1.1, -0.1] };

   audio: mechanical sound design, synthesized (no samples, no whooshes). Off until the viewer turns it on.
   click: a microswitch contact, a short bright noise burst plus a decaying ping. release: the softer return.
   tick: a data mark landing. seat: parts closing together. snap: a hard contact.
   Slides list cues as [time, kind, options]; a cue fires once when slide time passes it.
   ============================================================================================ */

  const comp = c.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.15;
  AU.master.connect(comp); comp.connect(c.destination);
  const n = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate), d = n.getChannelData(0); let s = 1234567;
  for (let i = 0; i < d.length; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = s / 0x3fffffff - 1; }

}

/** draw slide s at time t into a 2D context */
