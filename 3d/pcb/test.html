<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Theseus PCB — test</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:transparent}canvas{width:100vw;height:100vh;display:block}
#hud{position:fixed;left:12px;bottom:10px;font:12px/1.4 ui-monospace,monospace;color:#888;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><canvas></canvas><div id="hud"></div>
<script type="module">
// URL params:
//   view=hero|top|bottom|side|front|low|threeQuarterRight|module|pmic|antenna|sensor|switch|usb|custom
//   cam=x,y,z target=x,y,z fov=deg (custom)   ortho=1 (orthographic top/bottom)   transparent=1   ground=0
//   theme=paper|night  placement=origin|mouse  explode=0..1  power=0..1 mode=charge|run|both t=sec
//   reflow=0..1  xray=0..1  pressL=0..1 pressR=0..1  exaggerate=1  anim=1 (live loop)  hud=1
import * as THREE from 'three';
import { createStudio } from '../lib/studio.js';
import { buildPcb } from './pcb.js';
const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) ? parseFloat(Q.get(k)) : d);
const vec = (k) => Q.get(k).split(',').map(Number);
try {
  const transparent = Q.get('transparent') === '1';
  const studio = createStudio({ canvas: document.querySelector('canvas'), theme: Q.get('theme') || 'paper',
    width: innerWidth, height: innerHeight, transparent, fov: num('fov', 22), ground: Q.get('ground') !== '0',
    envIntensity: num('env', 0.9), key: num('key', 2.2), rim: num('rim', 1.4), fill: num('fill', 0.35) });
  const { scene, camera, renderer } = studio;
  const pcb = await buildPcb({ placement: Q.get('placement') || 'origin', pressExaggerate: num('exaggerate', 1), useParts: Q.get('parts') !== '0' });
  scene.add(pcb);
  const U = pcb.userData;
  const apply = (time = num('t', 0)) => {
    U.setExplode(num('explode', 0));
    U.setXray(num('xray', 0));
    U.setReflow(num('reflow', 0));
    U.setPower(num('power', 0), { mode: Q.get('mode') || 'charge', t: time });
    U.setPress('L', num('pressL', 0)); U.setPress('R', num('pressR', 0));
  };
  apply();
  scene.updateMatrixWorld(true);
  // board frame offset (origin placement centres the board): local z -> world z - 25.6
  const oz = Q.get('placement') === 'mouse' ? -2.88 : -24.6, oy = Q.get('placement') === 'mouse' ? 5.03 : 0;
  const P = (x, y, z) => new THREE.Vector3(x, y + oy, z + oz);
  const views = {
    // world frame (x = user's left); board-local z
    module: { cam: P(13, 26, 2), target: P(0, 0.6, 24.2), fov: 22 },
    antenna: { cam: P(9, 21, 47), target: P(0, 0.5, 26.0), fov: 22 },
    pmic: { cam: P(-23, 21, -3), target: P(-11.3, 0.4, 10.6), fov: 22 },
    sensor: { cam: P(16, 22, -10), target: P(0, 0.8, 4.0), fov: 22 },
    switch: { cam: P(34, 22, 58), target: P(15.5, 4, 40), fov: 22 },
    usb: { cam: P(12, 16, 70), target: P(0, 1, 49), fov: 22 },
  };
  let cam = camera;
  const view = Q.get('view') || 'hero';
  if (Q.get('ortho') === '1') {
    const bottom = view === 'bottom';
    const a = innerWidth / innerHeight;
    const halfH = num('halfh', 31.5);
    const oc = new THREE.OrthographicCamera(-halfH * a, halfH * a, halfH, -halfH, 0.1, 2000);
    const c = P(0, 0, num('cz', 24.6));
    // nose up on screen in both views (physically correct: top view shows the user's right on the right)
    oc.position.set(c.x, bottom ? -500 : 500, c.z);
    oc.up.set(0, 0, 1);
    oc.lookAt(c);
    oc.updateProjectionMatrix();
    cam = oc;
    studio.ground.visible = false;
  } else if (views[view] || Q.has('cam')) {
    const v = views[view] || {};
    const cp = Q.has('cam') ? new THREE.Vector3(...vec('cam')) : v.cam;
    const tg = Q.has('target') ? new THREE.Vector3(...vec('target')) : v.target;
    camera.fov = num('fov', v.fov || 22); camera.position.copy(cp); camera.up.set(0, 1, 0); camera.lookAt(tg);
    camera.near = 1; camera.far = 2000; camera.updateProjectionMatrix();
  } else {
    const dirs = { hero: [-0.78, 0.62, 0.95], top: [0, 1, 0.0001], bottom: [0, -1, 0.0001], side: [-1, 0.08, 0], front: [0, 0.12, 1],
      low: [-0.9, 0.22, 0.75], threeQuarterRight: [0.78, 0.62, 0.95], back: [0, 0.3, -1], exploded: [-0.85, 0.55, 0.9] };
    const boardNode = U.parts.board || pcb;
    const f = studio.frame(boardNode, { view: dirs[view] || dirs.hero, margin: num('margin', 0.82) });
    if (view === 'top' || view === 'bottom') { camera.up.set(0, 0, 1); camera.lookAt(f.center); }
  }
  if (Q.get('ground') === '0') studio.ground.visible = false;
  const hud = document.getElementById('hud');
  if (Q.get('hud') === '1') { const info = renderer.info; hud.textContent = `tris ${info.render.triangles}`; }
  if (Q.get('anim') === '1') {
    const t0 = performance.now();
    const tick = () => { apply((performance.now() - t0) / 1000); renderer.render(scene, cam); requestAnimationFrame(tick); };
    tick();
  } else {
    renderer.render(scene, cam);
    // a second frame: transmission materials need the opaque pass first
    renderer.render(scene, cam);
  }
  if (Q.get('hud') === '1') hud.textContent = `tris ${renderer.info.render.triangles}  calls ${renderer.info.render.calls}`;
  window.__pcb = pcb;
  window.__ready = true;
} catch (e) { window.__error = String(e && e.stack || e); console.error(e); }
</script></body></html>
