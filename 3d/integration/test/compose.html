<!DOCTYPE html><html><head><meta charset="utf-8"><title>compose</title>
<style>html,body{margin:0;background:#f7f6f2}canvas{display:block;width:1600px;height:900px}</style></head>
<body><canvas id="fx" width="1600" height="900"></canvas>
<script src="./r3d-test.js"></script>
<script>
const G = document.getElementById('fx').getContext('2d');
function frame(t) {
  G.fillStyle = '#f7f6f2'; G.fillRect(0, 0, 1600, 900);
  G.strokeStyle = 'rgba(0,0,0,0.08)'; for (let x = 0; x < 1600; x += 40) { G.beginPath(); G.moveTo(x, 0); G.lineTo(x, 900); G.stroke(); }
  const c = R3D.render('scan', t, { spin: 0 }, 1200, 700, 'paper');
  if (c) G.drawImage(c, 200, 100, 1200, 700);
  G.fillStyle = '#0d0e0f'; G.font = '800 64px sans-serif'; G.fillText('3D INSIDE THE 2D STAGE', 80, 110);
  return !!c;
}
R3D.prepare('scan', 'paper');
(function wait() { if (frame(1)) { window.__ready = true; } else setTimeout(wait, 200); })();
</script></body></html>
